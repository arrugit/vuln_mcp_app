# Docker Compose topology (TDD §27/§28). One-command local bring-up (DEP-001).
#
# Networks:
#   app-net      -> frontend <-> backend <-> mcp-server
#   sandbox-net  -> mcp-server <-> sandbox ONLY, internal:true (no Internet, SEC-005)
#
# All published ports bind to 127.0.0.1 (DEP-004). Only the sandbox is hardened
# with the SEC-003 controls; the rest is ordinarily-secure infrastructure.

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    networks: [app-net]
    depends_on: [backend]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///./data/vuln_mcp.db
      - MCP_SERVER_URL=http://mcp-server:9000
    ports:
      - "127.0.0.1:8000:8000"
    networks: [app-net, sandbox-net]
    volumes:
      - ./data:/app/data
    depends_on: [mcp-server]

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
    environment:
      - MCP_MODE=${MCP_MODE:-secure}
    networks: [app-net, sandbox-net]

  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    # SEC-003 isolation controls:
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /work
    networks: [sandbox-net] # no app-net, no default => no Internet egress

networks:
  app-net: {}
  sandbox-net:
    internal: true
